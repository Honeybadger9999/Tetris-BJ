<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TETRIS BATTLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 메뉴 -->
<div id="screen-menu" class="screen active">
  <h1 class="logo">TETRIS<br>BATTLE</h1>
  <div class="nick-row">
    <span id="nickDisplay"></span>
    <button id="btnNick" class="mini">변경</button>
  </div>
  <div class="menu">
    <button id="btnSingle">싱글 플레이</button>
    <button id="btn1v1">1:1 대결</button>
    <button id="btnMulti">멀티 대결 (4인)</button>
    <button id="btnRank" class="ghost">🏆 랭킹</button>
  </div>
  <p id="setupNote" class="sub" style="display:none">
    ※ 랭킹/대전은 config.js에 Supabase 설정 후 사용할 수 있습니다.
  </p>
  <p class="sub keys">← → 이동 · ↑/X 회전 · Z 역회전 · ↓ 소프트드롭<br>Space 하드드롭 · C/Shift 홀드 · P 일시정지</p>
</div>

<!-- 게임 -->
<div id="screen-game" class="screen">
  <div class="game-wrap">
    <div class="side left">
      <div class="panel-label">HOLD</div>
      <canvas id="holdCanvas" width="96" height="96"></canvas>
      <div class="stats">
        <div class="panel-label">SCORE</div><div id="statScore" class="stat">0</div>
        <div class="panel-label">LINES</div><div id="statLines" class="stat">0</div>
        <div class="panel-label">LEVEL</div><div id="statLevel" class="stat">1</div>
      </div>
      <button id="btnGameExit" class="mini">나가기</button>
    </div>
    <div class="board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="overlay">
        <div id="overlayMsg"></div>
        <div id="overlayButtons"></div>
      </div>
    </div>
    <div class="side right">
      <div class="panel-label">NEXT</div>
      <canvas id="nextCanvas" width="96" height="330"></canvas>
    </div>
    <div id="versusArea"></div>
  </div>
  <div id="touchControls">
    <button id="tLeft">◀</button>
    <button id="tDown">▼</button>
    <button id="tRight">▶</button>
    <button id="tRot">⟳</button>
    <button id="tDrop">⤓</button>
    <button id="tHold">H</button>
  </div>
</div>

<!-- 대전 대기실 -->
<div id="screen-lobby" class="screen">
  <h2 id="lobbyTitle">1:1 대결</h2>
  <div id="lobbySetup" class="box">
    <button id="btnCreateRoom">방 만들기</button>
    <div class="divider">또는</div>
    <input id="joinCode" maxlength="4" placeholder="방 코드 4자리" autocomplete="off">
    <button id="btnJoinRoom">참가하기</button>
  </div>
  <div id="lobbyRoom" class="box" style="display:none">
    <div class="panel-label">방 코드 (친구에게 공유하세요)</div>
    <div id="roomCode" class="code"></div>
    <div class="panel-label">참가자 <span id="memberCount"></span></div>
    <ul id="memberList"></ul>
    <button id="startBtn" style="display:none">게임 시작</button>
    <p id="hostHint" class="sub"></p>
  </div>
  <button id="btnLobbyExit" class="ghost">메뉴로</button>
</div>

<!-- 랭킹 -->
<div id="screen-rank" class="screen">
  <h2>🏆 랭킹</h2>
  <div id="rankTabs">
    <button data-period="week" class="on">이번 주</button>
    <button data-period="all">역대 최고</button>
  </div>
  <table class="rank-table">
    <thead><tr><th></th><th>닉네임</th><th class="num">점수</th><th class="num">줄</th></tr></thead>
    <tbody id="rankBody"></tbody>
  </table>
  <p class="sub">주간 랭킹은 매주 월요일에 새로 시작됩니다</p>
  <button id="btnRankBack" class="ghost">메뉴로</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
</body>
</html>
